<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>패키지강의 생성 가이드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background: #f5f6f8; color: #222; }

  .app { display: grid; grid-template-columns: 1fr 320px; min-height: 100vh; }

  /* 왼쪽: 스크린샷 + 핫스팟 */
  .stage { position: relative; background: #1e1e22; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .screen { position: relative; max-width: 100%; max-height: 90vh; box-shadow: 0 10px 40px rgba(0,0,0,.4); border-radius: 6px; overflow: hidden; }
  .screen img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }

  /* 핫스팟(투명 버튼) */
  .hotspot {
    position: absolute;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 4px;
  }
  .hotspot.correct {
    border: 3px solid #ff1744;            /* 항상 보이는 빨간 테두리 */
    border-radius: 6px;
    box-shadow: 0 0 0 2px rgba(255,255,255,.6); /* 흰색 외곽선으로 대비 강화 */
    animation: pulse 1.6s ease-in-out infinite; /* 주변 펄스로 시선 유도 */
  }
  .hotspot.correct:hover {
    background: rgba(255, 23, 68, .12);
  }
  .hotspot.hint {
    animation: flash 0.4s ease-in-out 6;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255,255,255,.6), 0 0 0 0 rgba(255, 23, 68, .6); }
    50%      { box-shadow: 0 0 0 2px rgba(255,255,255,.6), 0 0 0 14px rgba(255, 23, 68, 0); }
  }
  @keyframes flash {
    0%, 100% { background: rgba(255, 82, 82, 0); }
    50%      { background: rgba(255, 82, 82, .35); }
  }

  /* 오답 클릭 시 흔들림 */
  .shake { animation: shake 0.35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-8px); }
    75%      { transform: translateX(8px); }
  }

  /* 오른쪽 패널 */
  .panel { background: #fff; padding: 28px 24px; display: flex; flex-direction: column; gap: 20px; border-left: 1px solid #e5e7eb; }
  .progress { font-size: 13px; color: #6b7280; }
  .progress-bar { height: 6px; background: #eef0f3; border-radius: 99px; margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); transition: width .3s; }

  .step-title { font-size: 13px; color: #6366f1; font-weight: 600; }
  .step-instruction { font-size: 18px; line-height: 1.5; font-weight: 600; margin-top: 4px; white-space: pre-line; }
  .step-detail { font-size: 14px; color: #4b5563; line-height: 1.6; margin-top: 8px; white-space: pre-line; }

  .actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .btn { padding: 10px 14px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-size: 14px; }
  .btn:hover { background: #f9fafb; }
  .btn-primary { background: #4f46e5; color: #fff; border-color: #4f46e5; }
  .btn-primary:hover { background: #4338ca; }

  /* 토스트 */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #111; color: #fff; padding: 12px 20px; border-radius: 99px; font-size: 14px;
    opacity: 0; transition: all .3s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 완료 화면 */
  .done { text-align: center; padding: 40px 20px; }
  .done h2 { font-size: 22px; margin-bottom: 12px; }
  .done p { color: #6b7280; margin-bottom: 24px; }
</style>
</head>
<body>

<div class="app">
  <div class="stage">
    <div class="screen" id="screen">
      <img id="screenshot" alt="화면" />
      <!-- 핫스팟이 JS로 여기에 추가됨 -->
    </div>
  </div>

  <aside class="panel">
    <div>
      <div class="progress">
        <span id="progress-text">1 / 4 단계</span>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </div>

    <div id="content">
      <div class="step-title" id="step-title">STEP 1</div>
      <div class="step-instruction" id="step-instruction">시작</div>
      <div class="step-detail" id="step-detail"></div>
    </div>

    <div class="actions">
      <button class="btn" id="btn-hint">💡 힌트 보기</button>
      <button class="btn" id="btn-prev">← 이전 단계</button>
      <button class="btn" id="btn-reset">처음으로</button>

</div>

<div class="toast" id="toast"></div>

/* ============================================================
   ▲▲▲ 여기까지만 수정 ▲▲▲
============================================================ */

let current = parseInt(localStorage.getItem("guide-step") || "0", 10);
if (current >= steps.length) current = 0;

const $ = (id) => document.getElementById(id);

function render() {
  if (current >= steps.length) {
    renderDone();
    return;
  }
  const s = steps[current];
  $("screenshot").src = s.image;
  $("step-title").textContent = s.title;
  $("step-instruction").textContent = s.instruction;
  $("step-detail").textContent = s.detail || "";
  $("progress-text").textContent = `${current + 1} / ${steps.length} 단계`;
  $("progress-fill").style.width = `${((current) / steps.length) * 100}%`;

  // 첫 단계에서는 '이전 단계' 비활성화
  const prevBtn = $("btn-prev");
  if (prevBtn) {
    prevBtn.disabled = (current === 0);
    prevBtn.style.opacity = (current === 0) ? "0.4" : "1";
    prevBtn.style.cursor = (current === 0) ? "not-allowed" : "pointer";
  }

  // 기존 핫스팟 제거
  document.querySelectorAll(".hotspot").forEach(el => el.remove());
 
 const btn = document.createElement("button");
 btn.className = "hotspot correct";
 btn.style.left = s.hotspot.x + "%";
 btn.style.top = s.hotspot.y + "%";
 
  // 정답 핫스팟
  const btn = document.createElement("button");
  btn.className = "hotspot correct";
  btn.style.left = s.hotspot.x + "%";
  btn.style.top = s.hotspot.y + "%";
  btn.style.width = s.hotspot.w + "%";
  btn.style.height = s.hotspot.h + "%";
  btn.addEventListener("click", next);
  $("screen").appendChild(btn);

  // 화면 다른 곳 클릭 시 오답 처리
  $("screenshot").onclick = (e) => {
    showToast("그 버튼이 아니에요. 힌트를 눌러보세요!");
    $("screen").classList.remove("shake");
    void $("screen").offsetWidth;
    $("screen").classList.add("shake");
  };

  localStorage.setItem("guide-step", current);
}

function renderDone() {
  document.querySelector(".panel").innerHTML = `
    <div class="done">
      <h2>🎉 가이드 완료!</h2>
      <p>잘 따라오셨습니다.</p>
      <button class="btn btn-primary" onclick="restart()">처음부터 다시</button>
    </div>
  `;
  document.querySelectorAll(".hotspot").forEach(el => el.remove());
  $("progress-fill").style.width = "100%";
}

function next() {
  current++;
  render();
}

function prev() {
  if (current > 0) {
    current--;
    render();
  }
}

function restart() {
  current = 0;
  localStorage.removeItem("guide-step");
  location.reload();
}

function showHint() {
  const hs = document.querySelector(".hotspot.correct");
  if (!hs) return;
  hs.classList.add("hint");
  setTimeout(() => hs.classList.remove("hint"), 2400);
}

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 1800);
}

$("btn-hint").addEventListener("click", showHint);
$("btn-prev").addEventListener("click", prev);
$("btn-reset").addEventListener("click", restart);

render();

/* ============================================================
   📐 좌표 헬퍼: F12 콘솔에서 아래 함수 호출 후 화면 위를 클릭하면
   해당 위치의 % 좌표가 콘솔에 찍힙니다. 핫스팟 좌표 잡을 때 사용.
============================================================ */
window.findCoord = function() {
  const screen = document.getElementById("screen");
  screen.addEventListener("click", function handler(e) {
    const rect = screen.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
    const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
    console.log(`hotspot: { x: ${x}, y: ${y}, w: ?, h: ? }`);
  }, { capture: true });
  console.log("✅ 이제 화면을 클릭하면 좌표가 출력됩니다.");
};
</script>
